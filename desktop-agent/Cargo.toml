[package]
name = "desktop-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
screenshots = "0.8"
minifb = "0.27"
enigo = "0.2"
lz4_flex = "0.11"
cpal = "0.15"
arboard = "3.4"
rand = "0.8"
reqwest = { version = "0.11", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse"
] }